name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Compile and run unit tests
        working-directory: android-backup
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        if: success()
        working-directory: android-backup
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-unit-test-reports
          path: |
            android-backup/app/build/reports/tests/testDebugUnitTest/
            android-backup/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: android-backup/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
